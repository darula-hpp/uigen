version: '1.0'
enabled: {}
defaults: {}
annotations:
  document:
    x-uigen-app:
      name: ESP32 Control Panel
      icon: lucide:Cpu
    x-uigen-layout:
      type: dashboard-grid
      metadata:
        columns:
          mobile: 1
          tablet: 2
          desktop: 3
  GET:/health:
    x-uigen-ignore: true
  GET:/openapi.yaml:
    x-uigen-ignore: true
  GET:/:
    x-uigen-ignore: true
  GET:/simulator:
    x-uigen-ignore: true
  GET:/api/v1/state:
    x-uigen-ignore: true
  GET:/api/v1/board:
    x-uigen-label: Board Status
  GET:/api/v1/config:
    x-uigen-label: View Configuration
  PUT:/api/v1/config:
    x-uigen-label: Update Configuration
  GET:/api/v1/pins:
    x-uigen-label: GPIO Pins
  GET:/api/v1/pins/{pin_id}:
    x-uigen-label: View Pin
  PUT:/api/v1/pins/{pin_id}:
    x-uigen-label: Configure Pin
  GET:/api/v1/sensors:
    x-uigen-label: Sensors
  GET:/api/v1/sensors/{sensor_id}:
    x-uigen-label: View Sensor
  GET:/api/v1/sensors/{sensor_id}/readings:
    x-uigen-label: Sensor Readings
  POST:/api/v1/sensors/{sensor_id}/readings:
    x-uigen-label: Capture Reading
  GET:/api/v1/readings:
    x-uigen-label: All Readings
  POST:/api/v1/actions/blink:
    x-uigen-label: Blink LED
  POST:/api/v1/actions/reset:
    x-uigen-label: Reset Simulator
  Reading.sensor_id:
    x-uigen-ref:
      resource: Sensor
      valueField: id
      labelField: name
  Sensor.pin_id:
    x-uigen-ref:
      resource: Pin
      valueField: id
      labelField: name
  '#/paths/~1api~1v1~1readings/get/responses/200/content/application~1json/schema':
    x-uigen-chart:
      chartType: line
      xAxis: recorded_at
      yAxis: value
      options:
        title: Telemetry Over Time
  '#/paths/~1api~1v1~1sensors~1{sensor_id}~1readings/get/responses/200/content/application~1json/schema':
    x-uigen-chart:
      chartType: line
      xAxis: recorded_at
      yAxis: value
      options:
        title: Sensor History
